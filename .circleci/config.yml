version: 2.1
jobs:
  unit-3-9:
    docker:
      - image: thekevjames/nox
    steps:
      - checkout
      - run: nox -s unit-3.9 cover

  unit-3-10:
    docker:
      - image: thekevjames/nox
    steps:
      - checkout
      - run: nox -s unit-3.10 cover

  unit-3-11:
    docker:
      - image: thekevjames/nox
    steps:
      - checkout
      - run: nox -s unit-3.11 cover

  unit-3-12:
    docker:
      - image: thekevjames/nox
    steps:
      - checkout
      - run: nox -s unit-3.12 cover

  unit-3-13:
    docker:
      - image: thekevjames/nox
    steps:
      - checkout
      - run: nox -s unit-3.13 cover

  lint:
    docker:
      - image: thekevjames/nox
    steps:
      - checkout
      - run: nox -s lint

workflows:
